[project]
name = "riic"
version = "0.1.0"
description = "Arknights base (RIIC) planner for an owned roster"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1", "scipy>=1.15"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
required-version = ">=0.16"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
