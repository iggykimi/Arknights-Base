[project]
name = "riic"
version = "0.1.0"
description = "Plans an Arknights base (RIIC) for a player's roster with mixed-integer linear programming"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ignacio Montero Gil" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2", "openpyxl>=3.1", "scipy>=1.15"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
required-version = ">=0.16"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
