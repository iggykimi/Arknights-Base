<text x="20" y="524" font-size="12" fill="#9198a1">Percentages are each room's speed-up from its operators' skills. Gold: 116 bars a day made, 116 sold.</text>
<text x="20" y="542" font-size="12" fill="#9198a1">Power plants make drones recover 65% faster; all drones go to the trading post that earns most.</text>
<text x="20" y="560" font-size="12" fill="#9198a1">Workshop, training room and dormitories stay the same in both shifts. Each dormitory has 5 beds: 2 skilled operators and 3 resting.</text>
<text x="20" y="30" font-size="16" fill="#e6edf3" font-weight="600">iggykimi's base, shift A</text>
<text x="20" y="52" font-size="13" fill="#9198a1">While this shift works the base makes 65,078 LMD and 16,400 EXP a day (drones included).</text>
